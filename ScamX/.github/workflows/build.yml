name: Build ScamX

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Compile, test, and package
        run: ./gradlew :composeApp:testDebugUnitTest :composeApp:wasmJsBrowserDistribution :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: scamx-builds
          path: |
            composeApp/build/dist/wasmJs/productionExecutable/**
            composeApp/build/outputs/apk/debug/*.apk
